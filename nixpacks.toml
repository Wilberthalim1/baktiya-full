[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.dom", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd"]
aptPkgs = ["git"]

[phases.install]
cmds = [
    "curl -sS https://getcomposer.org/installer | php",
    "php composer.phar install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
    "php composer.phar exec -- php artisan config:cache",
    "php composer.phar exec -- php artisan route:cache",
    "php composer.phar exec -- php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php -S 0.0.0.0:$PORT -t public"
